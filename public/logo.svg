<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b68ff" />
      <stop offset="100%" stop-color="#6c40ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Stylized Game Controller / Geometric Shape -->
  <path 
    d="M 15 45 C 15 25, 30 20, 50 20 C 70 20, 85 25, 85 45 C 85 65, 80 80, 70 80 C 60 80, 55 65, 50 65 C 45 65, 40 80, 30 80 C 20 80, 15 65, 15 45 Z" 
    fill="url(#purple-glow)" 
    filter="url(#glow)"
  />
  
  <!-- D-Pad (Left side) -->
  <path d="M 30 40 L 30 50 M 25 45 L 35 45" stroke="#18181b" stroke-width="4" stroke-linecap="round" />
  
  <!-- Action Buttons (Right side) -->
  <circle cx="65" cy="40" r="3.5" fill="#18181b" />
  <circle cx="72" cy="47" r="3.5" fill="#18181b" />
</svg>
